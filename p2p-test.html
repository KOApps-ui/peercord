<!doctype html><html><body><pre id="log" style="font:12px monospace"></pre>
<script type="module">
import { joinRoom, selfId } from 'trystero/nostr'
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; console.log(...a) }
const roomId = new URLSearchParams(location.search).get('room') || 'test-room-1'
const room = joinRoom({ appId: 'peercord-v1', relayConfig: { urls: ['wss://nos.lol','wss://nostr.wine','wss://nostr.mom','wss://relay.snort.social'], warnOnRelayFailure: false } }, roomId)
log('selfId', selfId, 'room', roomId)
const action = room.makeAction('msg')
action.onMessage = (d, ctx) => log('MSG from', ctx.peerId, JSON.stringify(d))
room.onPeerJoin = id => log('PEER JOIN', id)
room.onPeerLeave = id => log('PEER LEAVE', id)
setInterval(() => action.send({ hi: Date.now(), from: selfId }).catch(e => log('SENDERR', e.message)), 2500)
</script></body></html>
