<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PeerCord — Sunucusuz, uçtan uca şifreli, P2P mesajlaşma uygulaması. Hesap yok, sunucu yok, sadece sen ve arkadaşların." />
    <meta name="theme-color" content="#0b0912" />
    <meta name="manifest" href="/manifest.webmanifest" />
    <title>PeerCord — Sunucusuz Sohbet</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Inter, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Service Worker Kaydı -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW kaydıldı:', reg.scope))
            .catch(err => console.error('SW kaydı hatası:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
